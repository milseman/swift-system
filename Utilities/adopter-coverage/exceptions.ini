# The ledger's hand-kept entries (status.sh's section 5, "Sites left", in
# Prototype/Status/STATUS.md): what holds a site that System's sources and
# mapping.ini can't explain. Each section is one entry; its name is its id.
# Seeded from Michael's answers of 2026-10-05.
#
#   kind      exception: Michael approved leaving the sites on C;
#             queued: System or adopter work already identified, with where;
#             undecided: the sites' status is Michael's to decide;
#             excluded: not sites at all (text, test data, another build);
#             gap: a System gap that System's sources can't show, because
#               System names the C interface but not the form the sites need,
#               or mapping.ini calls it not System's and Michael decided it is.
#   title     a short name for the tables
#   reason    why
#   decided   who decided, and when (an exception needs it)
#   ends      what would end it
#   where     where the work or the decision is recorded
#   work      for queued work: System, adopter, or both
#
# What an entry matches, by every rule it gives (lists separated by
# whitespace, shell globs allowed, `*` crossing directories):
#   repositories   names from scheme-main.tsv
#   paths          file paths within the repository
#   modules        the imported module (a marker has none)
#   names          C names the site uses        } either makes the entry
#   mapping        mapping.ini entries by id,   } hold those names at a site,
#                  one per line                 } not the whole site
#   platforms      the platforms the entry holds (default: every one)
#   only-under     a flag: the site compiles only where the flag is true
# An entry with no rule but `platforms` matches nothing. How the entries,
# System's sources and mapping.ini decide a site's one category is in
# scripts/ledger.py's docstring.

[E1]
kind = exception
title = the swift repo's standard library
reason = Code below System, which can't be imported there: the standard library (stdlib/public/Synchronization,
    stdlib/public/libexec/swift-backtrace, stdlib/public/Concurrency and the rest of stdlib/).
decided = Michael, 2026-10-05
ends = System moving beneath them in the toolchain. What proper layering would take is an open investigation.
repositories = swift
paths = stdlib/*

[E2]
kind = queued
work = adopter
title = swift-syntax's memcmp in SyntaxText.swift
reason = Not an exception: System wraps memcmp (Memory.compare(_:_:), Sources/System/Memory/MemoryBytes.swift), and
    swift-syntax uses it like any other adopter; a new dependency is no different from anything else. A better
    standard-library answer may come later.
decided = Michael, 2026-10-05
where = Michael's answers of 2026-10-05, in the coordinator's correction to recollapse-a, recollapse-b and ledger
ends = SwiftSyntax calling Memory.compare(_:_:)
repositories = swift-syntax
paths = Sources/SwiftSyntax/SyntaxText.swift

[E3]
kind = gap
title = Mach-O's file structures and architecture names, vm_prot_t, and ar.h's archive header
reason = Not an exception: the MachO module counts as a platform C module (modules.ini), and System is to wrap what
    swift-build's MachO.swift uses: the Mach-O file structures, vm_prot_t, and ar.h's ar_hdr, SARMAG and AR_EFMT1.
    mapping.ini's wrap = no for them was a lane's verdict. Mach-O's architecture names (MachO.dyld.utils) are
    read as Mach-O's too.
decided = Michael, 2026-10-05
ends = System wrapping them
mapping = Mach-O file format
    Mach-O architecture names
    ar archive header
names = vm_prot_t

[E4]
kind = queued
work = adopter
title = SWBLibc's and TSCLibc's Unix re-exports
reason = Not an exception: remove the Unix re-exports and fix what breaks. Their Windows re-exports aren't covered.
decided = Michael, 2026-10-05
where = Michael's answers of 2026-10-05, in the coordinator's correction to recollapse-a, recollapse-b and ledger
ends = the Unix re-exports gone, with their importers on System
repositories = swift-build swift-tools-support-core
paths = Sources/SWBLibc/* Sources/TSCLibc/*
platforms = Darwin Linux Musl Android FreeBSD OpenBSD WASI

[E5]
kind = gap
title = a dlopen that runs in the caller's image
reason = Not an exception: @rpath, @loader_path and $ORIGIN resolve against the image that calls dlopen, which is
    SystemPackage's when it's a library of its own. System is to add a form emitted into the caller
    (@_alwaysEmitIntoClient), as swift-build's own Library.open is. This answers Prototype/Coverage5/REPORT.md's
    N8.
decided = Michael, 2026-10-05
ends = DynamicLibrary's form emitted into the caller
repositories = swift-build
paths = Sources/SWBUtil/Library.swift
names = dlopen

[E6]
kind = undecided
title = swift-corelibs-foundation and swift-corelibs-xctest
reason = No recorded reason for deferring them; their status is undecided.
decided = Michael, 2026-10-05: undecided, not deferred
repositories = swift-corelibs-foundation swift-corelibs-xctest

[E7a]
kind = excluded
title = swift-integration-tests
reason = Its imports are what it tests.
decided = Michael, 2026-10-05
repositories = swift-integration-tests

[E7b]
kind = excluded
title = swift-format's OrderedImportsTests string literals
reason = Text, not imports. (The scan blanks string literals, so it finds none there anyway.)
decided = Michael, 2026-10-05
repositories = swift-format
paths = Tests/SwiftFormatTests/Rules/OrderedImportsTests.swift

[E7c]
kind = excluded
title = SwiftPM's Fixtures/ and TestObservation.swift's generated text
reason = Test data.
decided = Michael, 2026-10-05
repositories = swiftpm
paths = Fixtures/* */TestObservation.swift

[E7d]
kind = excluded
title = Foundation's #if FOUNDATION_FRAMEWORK code
reason = Apple's internal build only.
decided = Michael, 2026-10-05
repositories = swift-foundation
only-under = FOUNDATION_FRAMEWORK

# Prototype/Coverage5/REPORT.md's "Needs design", each as written there. N8
# is answered: it's E5. N4 to N7 and N9 came from ../swift-system-examples,
# which isn't in the update-checkout cluster, so they may hold no site here.

[N1]
kind = queued
work = System and adopter
title = fts on Linux in swift-foundation
reason = System's answer is DirectoryWalk, which Foundation's Darwin branch walks with. On Linux Foundation keeps fts:
    removal needs FTS_XDEV's same-device check, which DirectoryWalk doesn't have, and Foundation's comparison run
    (Darwin's 382) hasn't been done there.
where = Prototype/Coverage5/REPORT.md, Needs design N1 (its rank 2)
ends = DirectoryWalk's same-device option, then Foundation's comparison run on Linux
repositories = swift-foundation
names = fts_* FTS* _ftsent
platforms = Linux Musl Android WASI FreeBSD OpenBSD

[N2]
kind = queued
work = System
title = the thread API on WASI without threads
reason = wasip1's libc.a in the Swift 6.2.4 SDK defines no pthread symbols, so PThread can't link there. The question:
    locks that do nothing without threads (swift-async-algorithms' Lock, swift-log's stdout lock), or leaving
    them out, as wasi-libc does.
where = Prototype/Coverage5/REPORT.md, Needs design N2 (its rank 6)
ends = a decision, and System's API for it on WASI
names = pthread_* flockfile funlockfile ftrylockfile sched_yield
platforms = WASI

[N3]
kind = queued
work = System
title = pseudoterminals on OpenBSD
reason = System's form is posix_openpt, grantpt, unlockpt and ptsname_r, and OpenBSD has no ptsname_r. Options:
    ptsname, openpty from libutil, or /dev/ptm's PTMGET ioctl.
where = Prototype/Coverage5/REPORT.md, Needs design N3 (its rank 9)
ends = TerminalDescriptor.openPseudoterminal() on OpenBSD
names = openpty posix_openpt grantpt unlockpt ptsname ptsname_r forkpty login_tty
platforms = OpenBSD

[N4]
