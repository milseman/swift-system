# swift-foundation: FoundationEssentials and FoundationInternationalization,
# the Foundation that ships with the Swift toolchains, and its C shims. ICU
# and swift-collections are dependencies. The keys are described in
# README.md in this directory.

[package]
title = swift-foundation
name = Foundation
variable = FOUNDATION
checkout = ../swift-foundation
shim-targets = _FoundationCShims
# The mapping has no entries of Foundation's yet: the interfaces it uses get
# entries of their own, derived, rather than failing the check.
strict = no
skip.TestSupport = test support (Tests/TestSupport)
# FoundationInternationalization depends on every other library target;
# building only it skips TestSupport, whose swift-testing macros a compiler
# other than the toolchain's can't find.
build-targets = FoundationInternationalization
# Swift 6.2 gives up on the manifest's Package(...) expression ("unable to
# type-check this expression in reasonable time") at the default solver
# limit; a higher one only lets it take longer. Nothing else changes.
build-flags = -Xbuild-tools-swiftc -Xfrontend -Xbuild-tools-swiftc -solver-scope-threshold=10000000
unset-env = SWIFTCI_USE_LOCAL_DEPS
build-hint = swift-foundation's main branch needs a newer compiler than Swift 6.2 (its CI uses main-branch
    toolchains); set FOUNDATION_SWIFT_EXEC to such a toolchain's swiftc.
# Flags neither the package nor its CMake build defines, so the code they
# guard is compiled by no build this tool models, and the report counts it:
# FOUNDATION_FRAMEWORK is Apple's Foundation.framework, the NO_* flags and
# USE_TSS configure Apple-internal builds without a file system,
# formatters, localization or CFPreferences, and FOUNDATION_ICU_STRING_COMPARE
# and FOUNDATION_LIST_FORMAT_ICU select ICU implementations the package
# replaced (list formatting now uses generated tables).
false-flags = FOUNDATION_FRAMEWORK NO_FILESYSTEM NO_JSON_FOUNDATION_SPECIALIZATION NO_FORMATTERS NO_LOCALIZATION
    NO_PROCESS NO_CFPREFERENCES NO_TZFILE NO_TYPED_MALLOC NO_CSHIMS USE_TSS FOUNDATION_ICU_STRING_COMPARE
    FOUNDATION_LIST_FORMAT_ICU
# Foundation's OS layer, for the gap estimate: the file manager and file
# operations, reading and writing Data, path resolution, process and
# platform information, time zones, thread-local storage and dates, and its
# WinSDK and WASILibc extensions.
wrapper-files =
    Sources/FoundationEssentials/FileManager/*
    Sources/FoundationEssentials/FileManager/SearchPaths/*
    Sources/FoundationEssentials/Data/Data+Reading.swift
    Sources/FoundationEssentials/Data/Data+Writing.swift
    Sources/FoundationEssentials/String/String+Path.swift
    Sources/FoundationEssentials/Platform.swift
    Sources/FoundationEssentials/ProcessInfo/*
    Sources/FoundationEssentials/TimeZone/TimeZone_Cache.swift
    Sources/FoundationEssentials/_ThreadLocal.swift
    Sources/FoundationEssentials/Date.swift
    Sources/FoundationEssentials/WinSDK+Extensions.swift
    Sources/FoundationEssentials/WASILibc+Extensions.swift
