# swift-docc: generated by `Utilities/adopter-coverage/ecosystem.sh survey` from the
# swift repository's update-checkout main scheme (swiftlang/swift-docc at main). Edit it
# by hand only to say what the generator can't know; see README.md here.

[package]
title = swift-docc
name = swift-docc
variable = SWIFT_DOCC
checkout = ../ecosystem/swift-docc
in-all = no
# The mapping has no entries for this package's interfaces: those it
# doesn't name get entries of their own (see mapping.ini's header).
strict = no
note = One of the toolchain's packages (swiftlang/swift-docc, main).
# Library targets only: the executables and tests aren't audited.
build-targets = :libraries
