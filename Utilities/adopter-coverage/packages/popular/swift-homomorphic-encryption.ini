# swift-homomorphic-encryption: generated by `Utilities/adopter-coverage/ecosystem.sh --popular
# survey` from popular.tsv (apple/swift-homomorphic-encryption at main).
# Edit it by hand only to say what the generator can't know; see README.md here.

[package]
title = swift-homomorphic-encryption
name = swift-homomorphic-encryption
variable = SWIFT_HOMOMORPHIC_ENCRYPTION
checkout = ../ecosystem/swift-homomorphic-encryption
in-all = no
# The mapping has no entries for this package's interfaces: those it
# doesn't name get entries of their own (see mapping.ini's header).
strict = no
note = A popular package beyond the toolchain: homomorphic encryption for servers (apple/swift-homomorphic-encryption, main).
# Library targets only: the executables and tests aren't audited.
build-targets = :libraries
# _TestUtilities is test support (swift-testing helpers the package's tests
# share), a library product only so they can depend on it. The survey's
# test-support pattern already leaves it out; the check reads only this file.
skip._TestUtilities = test support
