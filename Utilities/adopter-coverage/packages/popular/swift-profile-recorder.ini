# swift-profile-recorder: generated by `Utilities/adopter-coverage/ecosystem.sh --popular
# survey` from popular.tsv (apple/swift-profile-recorder at main).
# Edit it by hand only to say what the generator can't know; see README.md here.

[package]
title = swift-profile-recorder
name = swift-profile-recorder
variable = SWIFT_PROFILE_RECORDER
checkout = ../ecosystem/swift-profile-recorder
in-all = no
# The mapping has no entries for this package's interfaces: those it
# doesn't name get entries of their own (see mapping.ini's header).
strict = no
note = A popular package beyond the toolchain: the in-process sampling profiler for services (apple/swift-profile-recorder, main).
# Library targets only: the executables and tests aren't audited.
build-targets = :libraries
