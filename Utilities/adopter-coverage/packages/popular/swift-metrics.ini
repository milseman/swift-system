# swift-metrics: generated by `Utilities/adopter-coverage/ecosystem.sh --popular
# survey` from popular.tsv (apple/swift-metrics at main).
# Edit it by hand only to say what the generator can't know; see README.md here.

[package]
title = swift-metrics
name = swift-metrics
variable = SWIFT_METRICS
checkout = ../ecosystem/swift-metrics
in-all = no
# The mapping has no entries for this package's interfaces: those it
# doesn't name get entries of their own (see mapping.ini's header).
strict = no
note = A popular package beyond the toolchain: the server metrics API (apple/swift-metrics, main).
# Library targets only: the executables and tests aren't audited.
build-targets = :libraries
