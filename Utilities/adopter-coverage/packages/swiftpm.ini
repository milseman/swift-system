# swift-package-manager: SwiftPM's own targets. Much of SwiftPM's OS work
# goes through its dependencies, swift-tools-support-core (TSC), llbuild and
# swift-driver, which the report measures but the mapping doesn't cover. The
# keys are described in README.md in this directory.

[package]
title = swift-package-manager
name = SwiftPM
variable = SWIFTPM
checkout = ../swift-package-manager
# Switches SwiftPM's manifest reads to build against local checkouts or
# frameworks, or with Apple-internal product types; the audit builds the
# manifest's default.
unset-env = SWIFTCI_USE_LOCAL_DEPS SWIFTPM_LLBUILD_FWK SWIFTPM_SWBUILD_FRAMEWORK SWIFTPM_USE_SYSTEM_SDK_DEPS
    ENABLE_APPLE_PRODUCT_TYPES SWIFTCI_DISABLE_SDK_DEPENDENT_TESTS SWIFTSYNTAX_BUILD_DYNAMIC_LIBRARY
    SWIFTCI_INSTALL_RPATH_OS
skip._InternalBuildTestSupport = test support
skip._InternalTestSupport = test support
skip._IntegrationTestSupport = test support
skip.tsan_utils = test support (C)
skip.PackageManagerDocs = documentation (an empty Swift file and a DocC catalog)
# SwiftPM doesn't run on WASI.
platforms = Darwin Linux Musl Android FreeBSD OpenBSD Windows
# Build the library targets only. `swift build` would also link and sign a
# dozen debug executables, each with swift-build and swift-driver linked in,
# which the audit skips anyway: most of the 6 GB the full build takes.
build-targets = :libraries
# SwiftPM's OS layer, for the gap estimate: Basics' process, signal,
# environment, keychain, SQLite and sandbox wrappers, the PackagePlugin and
# PackageDescription runtimes' I/O set-up, the test runner's support, and
# the registry's password prompt.
wrapper-files =
    Sources/Basics/Concurrency/AsyncProcess.swift
    Sources/Basics/Cancellator.swift
    Sources/Basics/Environment/Environment.swift
    Sources/Basics/SQLite.swift
    Sources/Basics/AuthorizationProvider.swift
    Sources/Basics/KnownFolders.swift
    Sources/Basics/OSSignpost.swift
    Sources/Basics/Sandbox.swift
    Sources/Runtimes/PackagePlugin/Plugin.swift
    Sources/Runtimes/PackageDescription/PackageDescription.swift
    Sources/Commands/Utilities/TestingSupport.swift
    Sources/PackageRegistryCommand/PackageRegistryCommand+Auth.swift
# The dependencies the report measures OS use through.
through = swift-tools-support-core swift-llbuild swift-driver
