# swift-nio: the adopter this tool was first written for (as nio-coverage).
# The keys are described in README.md in this directory.

[package]
title = swift-nio
name = NIO
variable = NIO
checkout = ../swift-nio
# C targets that exist to reach the OS. NIO's other C targets (CNIOAtomics,
# CNIOLLHTTP, CNIOSHA1) are implementations: their own functions are
# NIO-internal, but what they call in the C library counts.
shim-targets = CNIOLinux CNIODarwin CNIOWindows CNIOOpenBSD CNIOFreeBSD CNIOWASI CNIOPosix
# NIO's syscall layer: files whose functions exist only to reach the OS. The
# gap ranking counts the code lines of the thin wrapper functions (at most
# 40 lines) in these files that reference a gap, plus the C shims; see
# scripts/method.md.
wrapper-files =
    Sources/NIOPosix/System.swift
    Sources/NIOPosix/Linux.swift
    Sources/NIOPosix/LinuxUring.swift
    Sources/NIOPosix/LinuxCPUSet.swift
    Sources/NIOPosix/ThreadPosix.swift
    Sources/NIOPosix/ThreadWindows.swift
    Sources/NIOPosix/BSDSocketAPIPosix.swift
    Sources/NIOPosix/BSDSocketAPIWindows.swift
    Sources/NIOPosix/BSDSocketAPICommon.swift
    Sources/NIOPosix/Windows.swift
    Sources/NIOPosix/FileDescriptor.swift
    Sources/NIOCore/BSDSocketAPI.swift
    Sources/NIOCore/SystemCallHelpers.swift
    Sources/NIOConcurrencyHelpers/lock.swift
    Sources/NIOConcurrencyHelpers/NIOLock.swift
    Sources/NIOConcurrencyHelpers/NIOThreadPoolWorkAvailable.swift
    Sources/NIOFS/Internal/System Calls/*
    Sources/_NIOFileSystem/Internal/System Calls/*
# NIOFS and _NIOFileSystem are copies of each other, so their code counts
# twice in the gap estimate.
twin-targets = NIOFS _NIOFileSystem
