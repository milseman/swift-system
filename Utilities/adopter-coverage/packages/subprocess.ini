# swift-subprocess: running child processes, with their I/O, on every
# platform Swift supports that can spawn one. The keys are described in
# README.md in this directory.

[package]
title = swift-subprocess
name = Subprocess
variable = SUBPROCESS
checkout = ../swift-subprocess
shim-targets = _SubprocessCShims
skip.TestResources = test support
# WASI can't spawn a process; Subprocess's one os(WASI) branch is a stub.
platforms = Darwin Linux Musl Android FreeBSD OpenBSD Windows
# Subprocess's main branch calls Span.bytes, which the Swift 6.2 SDK makes
# available from macOS 26, below the package's macOS 13 floor; the newer
# toolchains Subprocess's CI uses back-deploy it. Raising the deployment
# target of the index build changes no code. (arm64: the tool runs on Apple
# silicon Macs.)
build-flags = -Xswiftc -target -Xswiftc arm64-apple-macosx26.0
# Subprocess's OS layer: one file per platform family for spawning and
# waiting, one per event mechanism for the pipes' asynchronous I/O, the
# worker thread, and the signals of teardown.
wrapper-files =
    Sources/Subprocess/Platforms/*
    Sources/Subprocess/IO/AsyncIO+*.swift
    Sources/Subprocess/Thread.swift
    Sources/Subprocess/Teardown.swift
