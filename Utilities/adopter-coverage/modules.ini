# Which imported modules count as platform C modules: the one list that
# status.sh's platform imports (section 4 of Prototype/Status/STATUS.md) and
# its ledger of sites left (section 5) both read, through
# scripts/ledger.py's Modules.
#
# From Michael, 2026-10-05, after reading the macOS SDK's
# usr/include/module.modulemap: MachO isn't part of Darwin (a file with only
# `import Darwin` can't see mach_header or _dyld_image_count); it's a
# top-level module of its own, and it counts. Each section is one group:
#
#   modules   module names, separated by whitespace
#   patterns  shell globs for more module names (`*_h`)
#   decided   who decided, and when
#   note      what the group means for the tools
#
# A module named in no group isn't counted, and isn't listed.

[count]
note = Counted on every platform, exactly as Darwin: an import of one is a site, and the floor holds on a platform
    only when no site is left there but exceptions. Android has split modules of the same names as the C standard
    library's (unistd, stdlib_h, string_h).
decided = Michael, 2026-10-05
modules = Darwin Glibc Musl Bionic Android WASILibc ucrt WinSDK CRT visualc
    MachO libkern kcdata libunwind unwind_h pthread sched sys_select unistd xlocale nl_types
    assert_h complex_h ctype_h errno_h fenv_h float_h inttypes_h iso646_h limits_h locale_h math_h setjmp_h
    signal_h stdalign_h stdarg_h stdatomic_h stdbool_h stddef_h stdint_h stdio_h stdlib_h stdnoreturn_h
    string_h threads_h time_h
patterns = *_h

[report]
note = Every import is a site, listed as undecided, but none counts toward the floor yet: Michael decides module by
    module.
decided = Michael, 2026-10-05
modules = os os_object os_workgroup notify launch Bootstrap vproc XPC dnssd asl

[not System's]
note = Libraries, not OS interfaces: their imports aren't sites. The ledger gives their count by module, and
    mapping.ini's names from them aren't read as a platform module's.
decided = Michael, 2026-10-05 (reviewed)
modules = Dispatch DispatchIntrospection ObjectiveC SQLite3 ICU zlib Compression FFI EditLine CUPS gssapi krb5
    ldap AppleTextureEncoder xcselect
