status = missing
note = NIO reads errno after every direct C call (syscall(blocking:), NIOFS's valueOrErrno, the C shims'
    callers). Errno.current is internal in System, so NIO can't read errno through it; once NIO calls System for
    an operation, it gets the Errno thrown instead.

