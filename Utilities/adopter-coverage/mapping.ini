# What the mapping adds to what System's sources say about each OS and
# C-library interface that swift-system's adopters use. It's one mapping for
# every package in packages/, since what System covers doesn't depend on who
# asks.
#
# System's coverage is derived, not kept here: at each System commit,
# scripts/derive.py reads the "The corresponding C function is `x`." (and
# constant, type, error, macro, field) sentences of its public doc comments
# and its CInterop typealiases, and scripts/check.py decides each entry from
# them (see its Derivation class, and scripts/method.md). An entry here
# gives what can't be derived: which symbols make up one concept, the
# category, notes, and a status only where the derivation can't see the
# truth. Every run's report says which entries the derivation decided and
# where a status here disagrees with it.
#
# Each section is one entry: an interface, or a group of symbols that make
# up one concept (a function with its flags, constants and types). Keys:
#
#   symbols   the extractor's names for the entry's symbols, separated by
#             whitespace; defaults to the section name. Every symbol a
#             package's extraction finds should be in exactly one entry; an
#             interface no entry names gets an entry of its own, derived, in
#             the category [config] suggests for it, and for the packages
#             that ask (`strict`, the default) it's a problem to fix here.
#   category  one of the categories in scripts/check.py (CATEGORIES).
#   status    only where the derivation can't decide:
#             covered: System has the operation, although its doc comments
#               don't name these symbols; an override, with a note saying
#               why;
#             partial: System has some of it, and the notes say what's
#               missing or different: a judgment, such as a socket option
#               reachable only through the generic getOption/setOption;
#             missing: System has nothing for it, whatever its doc
#               comments name;
#             ignore: not an OS interface (an extractor false positive);
#               needs a note.
#             Without a status, the derivation decides. "Covered" allows
#             differences of convention, such as NIO turning EAGAIN into
#             IOResult.wouldBlock or Errno into IOError.
#   system    for a covered or partial status, the System declarations, one
#             per line: `Scope: declaration` (or a bare top-level
#             declaration) as the source spells it, without attributes or
#             access modifiers. check.sh fails if one isn't on the checked
#             commit. Where each one compiles decides the status per
#             platform.
#   status.<Platform>
#             an override for one platform: `missing: reason`.
#   same.<symbol>
#             a C name the symbol reads as, for the derivation: ucrt's
#             _chsize_s is ftruncate. (ucrt's `_x` reads as `x` on Windows
#             without saying.)
#   swift     for a missing entry, what the Swift standard library offers
#             instead, if anything.
#   note      what System has and lacks for the entry, whoever asks.
#   note.<package>
#             what that package (the name of its file in packages/: nio,
#             foundation, swiftpm, subprocess) does with the entry, and what
#             it needs that differs. A package's report shows its own note
#             and the shared one.
#
# Conventions that notes don't repeat:
# - System's wrappers retry EINTR when retryOnInterrupt is true (the default)
#   and otherwise throw Errno, with no preconditions. APIs marked System 199
#   are unreleased.
# - NIO's syscall wrappers (Posix.* in NIOPosix/System.swift) retry EINTR,
#   turn EAGAIN into .wouldBlock, trap on EBADF and EFAULT (and EINVAL for
#   reads and writes), and throw IOError.

[config]
# Error-state accessors that every wrapper touches as part of its error
# handling. The gap estimate gives them no wrapper-function lines (they'd
# otherwise own NIO's generic syscall helpers, which go away only when
# NIO's calls move to System), only their own shims.
secondary = errno WSAGetLastError GetLastError SetLastError _get_errno _set_errno CNIOWindows_errno CNIOWindows_set_errno
# The category of an interface no entry names: by the header that declares
# it (`GLOB...: category`, first match), then by its name (`REGEX:
# category`). Lexically found names have no header.
header-category =
    sys/socket.h netinet/* netinet6/* arpa/inet.h sys/un.h sys/vsock.h net/if_dl.h: sockets
    netdb.h: name resolution
    net/if.h ifaddrs.h net/*: network interfaces
    pthread/* pthread.h sys/_pthread/* sched.h os/lock.h: threads & locks
    sys/errno.h errno.h: errno & errors
    spawn.h sys/spawn.h sys/wait.h sys/resource.h sysexits.h libproc.h sys/proc_info.h: processes
    signal.h sys/signal.h _DarwinFoundation3 (Swift overlay): signals
    sys/event.h sys/poll.h poll.h sys/select.h: event notification
    fts.h dirent.h sys/dirent.h: directories
    sys/stat.h sys/_types/_mode_t.h sys/xattr.h copyfile.h sys/mount.h sys/statvfs.h sys/attr.h sys/clonefile.h pwd.h grp.h: file system
    sys/fcntl.h fcntl.h sys/_types/_seek_set.h sys/uio.h sys/file.h unistd.h sys/unistd.h: file I/O
    termios.h sys/termios.h sys/ioctl.h sys/ttycom.h: terminals
    time.h sys/time.h mach/mach_time.h: time
    sys/mman.h malloc/* stdlib.h _stdlib.h: memory
    dlfcn.h mach-o/*: dynamic loading
    sys/sysctl.h sys/utsname.h mach/*: system info
    dispatch/* Dispatch (Swift overlay): dispatch
    Security/* CoreFoundation/* os/* os (Swift overlay) *.swiftinterface Network/* IOKit/* CoreServices/* SystemConfiguration/* CryptoKit/* ObjectiveC* objc/* XCTest*: Apple frameworks
    sqlite3.h zlib.h libxml/* curl/*: C libraries
    _stdio.h stdio.h _string.h string.h secure/* ctype.h _ctype.h math.h wchar.h locale.h strings.h stdarg.h _DarwinFoundation1 (Swift overlay) _DarwinFoundation2 (Swift overlay): strings/ctype/libm/stdio
    stdatomic.h: atomics
    stdint.h stddef.h __stddef_* stdbool.h sys/__endian.h limits.h: C language
    arm_neon.h *intrin.h: compiler intrinsics
name-category =
    ^(pthread_|PTHREAD_|sched_|SRWLOCK|CRITICAL_SECTION|CONDITION_VARIABLE|Initialize(SRWLock|CriticalSection|ConditionVariable)|(Acquire|Release)SRWLock|(Enter|Leave|Delete)CriticalSection|Fls|Tls|os_unfair_lock): threads & locks
    ^(epoll_|EPOLL|eventfd|EFD_|timerfd|TFD_|inotify_|IN_[A-Z]|kqueue|kevent|EV_|EVFILT_|NOTE_|poll|POLL|signalfd|select$|fd_set|FD_): event notification
    ^(io_uring|IORING_): io_uring
    ^(E[A-Z0-9]+|errno|strerror.*|WSAE[A-Z]+|ERROR_[A-Z_]+|GetLastError|WSAGetLastError|_get_errno|_set_errno)$: errno & errors
    ^(SIG[A-Z0-9]+|sig[a-z]+|SA_[A-Z]+|raise)$: signals
    ^(SO_|SOL_|IP_|IPV6_|IPPROTO_|TCP_|UDP_|MSG_|AF_|PF_|SOCK_|SHUT_|SD_|INADDR_|IN6ADDR_|sockaddr|socket|bind$|listen$|accept|connect$|send|recv|getsockopt|setsockopt|getsockname|getpeername|shutdown$|WSA|SOCKET|in6?_|inet_|hton|ntoh|CMSG_|cmsghdr|msghdr|mmsghdr|iovec): sockets
    ^(getaddrinfo|freeaddrinfo|gai_|addrinfo|AI_|NI_|getnameinfo|GetAddrInfo|ADDRINFO|gethostby): name resolution
    ^(if_|IF_|ifaddrs|getifaddrs|freeifaddrs|IFF_|ifreq|GetAdapters|IP_ADAPTER): network interfaces
    ^(posix_spawn|POSIX_SPAWN|fork|vfork|exec[lv]|execve|wait|WEXIT|WIF|WTERM|WSTOP|WCORE|W[A-Z]+SIG|kill|getpid|getppid|setsid|setpgid|getpgid|getpgrp|pidfd|P_PID|CreateProcess|PROCESS_|STARTUPINFO|TerminateProcess|GetExitCodeProcess|OpenProcess|prctl|PR_|getrlimit|setrlimit|RLIMIT_|rlimit|getrusage|_exit|exit$|atexit|getuid|geteuid|getgid|getegid|setuid|setgid): processes
    ^(clock_|CLOCK_|gettimeofday|nanosleep|time$|time_t|timespec|timeval|GetTickCount|QueryPerformance|timeGetTime|Sleep$|usleep|sleep$|mach_absolute_time|localtime|gmtime|mktime|strftime|tm$|tzset): time
    ^(mmap|munmap|mprotect|madvise|msync|MAP_|PROT_|MADV_|MS_|malloc|free$|calloc|realloc|posix_memalign|aligned_alloc|malloc_size|malloc_usable_size|VirtualAlloc|VirtualFree|HeapAlloc|GetProcessHeap): memory
    ^(dlopen|dlsym|dlclose|dlerror|dladdr|RTLD_|LoadLibrary|GetProcAddress|FreeLibrary|GetModuleHandle|_dyld): dynamic loading
    ^(sysconf|_SC_|uname|utsname|sysctl|GetSystemInfo|SYSTEM_INFO|GetComputerName|gethostname|getenv|setenv|unsetenv|environ|getpagesize|GetEnvironmentVariable|SetEnvironmentVariable|getlogin|getpw|getgr|passwd|group$): system info
    ^(tc[a-z]+|cf[a-z]+speed|cfmakeraw|termios|TIOC|isatty|ioctl|winsize|TCSA|ECHO|ICANON|ttyname|openpty|forkpty|posix_openpt|grantpt|unlockpt|ptsname): terminals
    ^(opendir|fdopendir|readdir|closedir|DIR$|dirent|DT_|fts_|FTS|scandir|glob$|globfree|glob_t|FindFirstFile|FindNextFile|FindClose|WIN32_FIND_DATA): directories
    ^(stat|lstat|fstat|fstatat|stat64|S_I|chmod|fchmod|fchmodat|chown|fchown|lchown|fchownat|mkdir|mkdirat|rmdir|unlink|unlinkat|remove$|rename|renameat|link$|linkat|symlink|symlinkat|readlink|readlinkat|realpath|access$|faccessat|utime|futimes|futimens|utimensat|UTIME_|mkfifo|mknod|chdir|fchdir|getcwd|umask|truncate|statfs|statvfs|MAX_PATH|PATH_MAX|mkstemp|mkdtemp|tmpfile|getxattr|setxattr|listxattr|removexattr|copyfile|clonefile|GetFileAttributes|SetFileAttributes|DeleteFile|MoveFile|CreateDirectory|RemoveDirectory|GetFullPathName|GetCurrentDirectory|SetCurrentDirectory|GetTempPath): file system
    ^(open|openat|close|read|write|pread|pwrite|lseek|SEEK_|dup|dup2|dup3|pipe|pipe2|fcntl|F_[A-Z]|O_[A-Z]|fsync|fdatasync|ftruncate|writev|readv|sendfile|flock|LOCK_|_read|_write|_close|_open|_lseek|CreateFile|ReadFile|WriteFile|CloseHandle|HANDLE|INVALID_HANDLE_VALUE|GENERIC_|FILE_[A-Z]|STD(IN|OUT|ERR)_FILENO|copy_file_range|fallocate|posix_fallocate|posix_fadvise): file I/O
    ^(atomic_|memory_order|ATOMIC_|OSAtomic): atomics
    ^(str|mem|wcs|is(alpha|digit|space|upper|lower|alnum|print|punct|xdigit|cntrl|graph|ascii)$|to(upper|lower)$|v?s?n?printf|v?fprintf|puts|fputs|fopen|fdopen|fclose|fread|fwrite|fflush|fgets|fputc|getc|getchar|putc|putchar|fileno|setvbuf|perror|FILE$|stdin$|stdout$|stderr$|abs$|labs|sqrt|pow|log|exp|floor|ceil|round|fmod|sin|cos|tan|atan|qsort|bsearch|strto|ato[ifl]|rand|srand|arc4random|random$|srandom|getline|getdelim|asprintf|setlocale|newlocale|freelocale|uselocale|nl_langinfo|iconv): strings/ctype/libm/stdio
    ^(u?int(8|16|32|64|ptr|max)_t|size_t|ssize_t|off_t|ptrdiff_t|NULL|bool|true|false|CHAR_BIT|DWORD|WORD|BYTE|BOOL|UINT|ULONG|LONG|WCHAR|LPWSTR|LPCWSTR|LPVOID|PVOID|USHORT|va_list|va_start|va_end|va_arg|va_copy|max_align_t|wchar_t|offsetof|alignof|static_assert|PRI[diouxX](8|16|32|64|PTR|MAX)|SCN[diouxX](8|16|32|64|PTR|MAX))$: C language
    ^(U?(INT|LONG|LLONG|SHRT|CHAR|SCHAR)(8|16|32|64|PTR|MAX)?_(MAX|MIN)|SIZE_MAX|SSIZE_MAX|PTRDIFF_(MAX|MIN)|INTPTR_(MAX|MIN)|UINTPTR_MAX|__[A-Z_]+__|__DARWIN_\w+|__STRING|__CONCAT)$: C language
    ^(__builtin|_mm_|__m128|vld|vst|__sync_): compiler intrinsics
    ^(Dispatch|dispatch_): dispatch
    ^(ObjCBool|NSObject|objc_|sel_|class_|object_|Selector$|autoreleasepool): Apple frameworks
# The System lane that should take a gap, for the combined and ecosystem
# reports: `WHAT: lane`, first match (scripts/lanes.py). WHAT is `symbol
# REGEX` (one of the entry's symbols), `category NAME`, `only PLATFORM...`
# (every platform the gap is on is one of these) or `default`. A lane of
# `-` is no lane: there's no Windows or WASI lane.
lanes =
    only Windows: - (Windows)
    only WASI: - (WASI)
    only WASI Windows: - (Windows, WASI)
    symbol (f?statv?fs(64)?|statfs_t|getmntinfo|getfsstat|getmntent|setmntent|endmntent|hasmntopt|MNT_[A-Z_]+|ST_(RDONLY|NOSUID|NODEV|NOEXEC)|statvfs_t|fsblkcnt_t|fsfilcnt_t|f_[a-z]+): statfs
    category sockets: sockets
    category name resolution: sockets
    category network interfaces: sockets
    category processes: processes
    category signals: processes
    category Apple frameworks: darwin-more
    category dispatch: darwin-more
    only Darwin: darwin-more
    category io_uring: linux-build
    only Linux Musl Android: linux-build
    default: posix-more

# ================================================================ file I/O

[read]
symbols = read _read
category = file I/O
note.nio = Posix.read, used for sockets, pipes, timerfd and NonBlockingFileIO. On Windows NIO calls ucrt's _read
    directly; System's Windows implementation is the same call.
note.subprocess = The fork-exec shim's child reports exec failures to the parent over a pipe, which the parent reads.
note.swiftpm = AsyncProcess reads a child's output pipes (readOutput).

[write]
symbols = write _write
category = file I/O
note.nio = Posix.write, and SelectableEventLoop's printError, which loops over write(2) by hand; writeAll(_:) does
    that loop. On Windows System's implementation is ucrt's _write, which NIO calls directly.
note.subprocess = The fork-exec shim's child writes its errno to the parent's status pipe before _exit.

[pread]
category = file I/O
note.nio = NonBlockingFileIO's positional reads.

[pwrite]
category = file I/O
note.nio = NonBlockingFileIO's positional writes.

[writev]
symbols = writev
category = file I/O
note.nio = Gathering writes for every stream socket and pipe write with more than one buffer (Posix.writev,
    NIOBSDSocket.writev, PipePair): NIO's hottest write path. System has the iovec type (CInterop.IOVec) and an
    io_uring writev opcode, but no writev or readv wrapper. It has to take a caller-owned iovec buffer: NIO reuses
    a pooled array and can't allocate per write.

[UIO_MAXIOV]
category = file I/O
status = partial
system =
    SystemConfig: static func value(_ name: Name) throws(Errno) -> Int?
    SystemConfig.Name: static var maxIOVectors: Self
note.nio = NIO sizes its iovec pool from the compile-time constant; System offers only the runtime
    sysconf(_SC_IOV_MAX) value.

[iovec]
category = file I/O
note.nio = The C type, through SystemSockets' CInterop alias. It isn't in SystemPackage, where a writev would need it.

[lseek]
symbols = lseek _lseek SEEK_SET SEEK_CUR SEEK_END
category = file I/O
note.nio = NIO passes raw SEEK_* values; SeekOrigin(rawValue:) takes them too. On Windows System uses _lseeki64,
    NIO _lseek.

[close]
symbols = close _close
category = file I/O
note.nio = Posix.close treats EINTR as success and traps on EBADF on every platform (isUnacceptableErrnoOnClose);
    System doesn't retry close and throws .interrupted, which NIO would catch. Also used by the C shims'
    UDP-offload probes and Android thread-name lookup.
note.subprocess = The fork-exec shim closes descriptors in the child, and Subprocess closes pipe ends in the parent.
note.swiftpm = The PackageDescription and PackagePlugin runtimes close the CRT descriptors behind their message pipes on Windows.

[dup]
symbols = dup _dup dup2 _dup2
category = file I/O
note.nio = NIOPipeBootstrap duplicates user descriptors. On Windows System's implementation is _dup.
note.subprocess = The fork-exec shim dup2s the child's standard descriptors.
note.swiftpm = The PackagePlugin runtime moves stdout aside, so that a plugin's prints can't corrupt the message stream to SwiftPM.

[ftruncate]
symbols = ftruncate _chsize_s
category = file I/O
note.nio = NonBlockingFileIO's changeSize. On Windows System's implementation is _chsize_s, as NIO's is.
same._chsize_s = ftruncate

[fsync]
category = file I/O
note.nio = NIOFS's FileHandle.synchronize. Not on Windows, where NIOFS keeps its own stand-in.

[open]
symbols = open O_RDONLY O_WRONLY O_RDWR O_CREAT O_CLOEXEC CNIOWASI_O_CREAT
category = file I/O
note.nio = Posix.open (vsock's /dev/vsock) and NIOCore's NIOFileHandle(path:). NIO passes a raw oflag; System splits
    it into AccessMode and OpenOptions, both constructible from raw values, and traps on .create without
    permissions. CNIOWASI_O_CREAT exists only because the Clang importer can't see WASILibc's O_CREAT; System reads
    it through its own shim.
note.subprocess = Opening /dev/null for discarded output, and kqueue's close-on-exec open on the BSDs.
note.swiftpm = AsyncProcess creates its pipes close-on-exec.

[synchronized I/O flags]
symbols = O_SYNC O_DSYNC O_RSYNC
category = file I/O
note = OpenOptions' and StatusFlags' sync, dataSync and readSync (SynchronizedIO.swift; FreeBSD's sync is in
    FileDescriptor.swift). O_RSYNC is O_SYNC where a header declares it, on Linux, Android and OpenBSD; Darwin and
    FreeBSD have none, and System has none of the three on WASI (Prototype/Coverage7/REPORT.md, section 4).

[Windows open]
symbols = _sopen_s _O_NOINHERIT _SH_DENYNO _S_IREAD _S_IWRITE _O_BINARY _open_osfhandle
category = file I/O
status = covered
system =
    FileDescriptor: static func open(_ path: UnsafePointer<CInterop.PlatformChar>, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
note.nio = NIOCore's NIOFileHandle on Windows opens with ucrt's _sopen_s. System's Windows open is the wide-character
    _wsopen_s with the same share mode; closeOnExec maps to _O_NOINHERIT.
note.subprocess = _open_osfhandle's _O_BINARY for pipes.
note.swiftpm = The PackageDescription runtime makes a CRT descriptor from its output handle.

[openat]
category = file I/O
note.nio = NIOFS opens everything relative to a directory descriptor. Adopted already on NIO's adopt-nio branch.

[AT_FDCWD]
category = file system
note.nio = NIOFS on Linux resolves paths relative to the current directory with AT_FDCWD; System's *at APIs take a
    FileDescriptor, and there's no FileDescriptor constant for the current directory.

[O_TMPFILE]
symbols = O_TMPFILE CNIOLinux_O_TMPFILE
category = file I/O
note.nio = NIOFS on Linux creates unnamed temporary files with O_TMPFILE, then links them into place with linkat and
    AT_EMPTY_PATH. OpenOptions has no .temporaryFile.

[fcntl status flags]
symbols = fcntl F_GETFL F_SETFL O_NONBLOCK
category = file I/O
note.nio = NIO's only fcntl use is setting O_NONBLOCK, in two identical copies (Posix.setNonBlocking, and
    setNonBlocking(fileDescriptor:) in NIOPosix/FileDescriptor.swift), which also map Darwin's EINVAL on a closed
    socket to NIOFcntlFailedError. statusFlags() and setStatusFlags(_:) do the same get-and-set. On Windows NIO
    uses ioctlsocket(FIONBIO) instead.
note.subprocess = Setting pipes non-blocking for the asynchronous I/O (AsyncIO+Unix.swift), and the shims' flag checks.
note.swiftpm = The test runner's safeExec.

[F_SETNOSIGPIPE]
category = sockets
note.nio = Darwin's per-descriptor SIGPIPE suppression, which NIO applies to sockets and pipes alike
    (BaseSocketProtocol.ignoreSIGPIPE). Darwin only, as the call is; other platforms ignore SIGPIPE process-wide
    (see [SIGPIPE]).

[fchmod]
category = file system
note.nio = NIOFS's FileHandle.replacePermissions.

[futimens]
symbols = futimens UTIME_NOW UTIME_OMIT CNIOLinux_UTIME_NOW CNIOLinux_UTIME_OMIT
category = file system
note.nio = NIOFS's FileHandle.setTimes. UTIME_OMIT is a nil argument and UTIME_NOW is setTimesToNow; the CNIOLinux
    constants exist because Glibc's UTIME_* macros don't import.

[utimes]
symbols = utimes futimes lutimes
category = file system
same.utimes = utimensat
same.futimes = futimens
same.lutimes = utimensat
note = The microsecond forms: FilePath's and FileDescriptor's setTimes, which take timespecs; a timeval's
    CInterop.TimeVal converts through Duration.

[fstat]
category = file system
note.nio = NIOFS's FileHandle.info, and NIOPipeBootstrap's check that a descriptor is a pipe, socket or character
    device. Stat.type replaces NIO's S_IFMT switch.
note.subprocess = Checking a pipe's buffer size (queryPipeBufferSize).

[ioctl]
category = file I/O
status = covered
system =
    TerminalDescriptor: func windowSize() throws(Errno) -> WindowSize
    SocketDescriptor: func localContextID() throws(Errno) -> VMSocketAddress.ContextID
note = ioctl multiplexes requests, and System has the ones the audited packages make: a terminal's size
    (TIOCGWINSZ, swift-argument-parser and swift-tools-support-core) and a VM socket's local context ID (NIO).
    A package with another request needs its own entry.
note.nio = Posix.ioctl has one caller: reading the local vsock context ID (IOCTL_VM_SOCKETS_GET_LOCAL_CID, on
    the socket on Darwin and on /dev/vsock on Linux): SocketDescriptor.localContextID(), Darwin only.

[pipe]
symbols = pipe pipe2 _subprocess_pipe_cloexec
category = file I/O
note = pipe, and pipe2 with close-on-exec and non-blocking options. pipe(options:) needs macOS 27 on Darwin.
note.subprocess = Every standard-I/O pipe, and the exec-status pipe, created close-on-exec atomically where pipe2
    exists (the _subprocess_pipe_cloexec shim falls back to pipe and fcntl).
note.swiftpm = AsyncProcess's pipes to a child's standard I/O.

[descriptor flags]
symbols = F_GETFD F_SETFD FD_CLOEXEC
category = file I/O
note = Reading and setting a descriptor's close-on-exec flag.
note.subprocess = The shims' fallbacks for pipe2 and dup3, and clearing close-on-exec on the child's descriptors.
note.swiftpm = The test runner clears close-on-exec before exec (safeExec).

[close-on-exec duplicates]
symbols = dup3 F_DUPFD_CLOEXEC _subprocess_dup_cloexec
category = file I/O
note = Duplicating a descriptor close-on-exec in one step: dup3 (macOS 27 on Darwin) and fcntl(F_DUPFD_CLOEXEC).
note.subprocess = Duplicating the caller's descriptors for a child without leaking them into other children.

[standard descriptors]
symbols = STDIN_FILENO STDOUT_FILENO STDERR_FILENO
category = file I/O
status = covered
system =
    FileDescriptor: static var standardInput: FileDescriptor
    FileDescriptor: static var standardOutput: FileDescriptor
    FileDescriptor: static var standardError: FileDescriptor
note = The standard descriptors' numbers.
note.subprocess = The fork-exec shim's child dup2s its pipes onto them.

[closing inherited descriptors]
symbols = close_range closefrom SYS_getdents64 getdtablesize
category = file I/O
same.getdtablesize = _SC_OPEN_MAX
note = Closing every descriptor above a number: close_range (Linux, FreeBSD), closefrom (OpenBSD, FreeBSD), or
    walking /proc/self/fd with getdents64; getdtablesize, the loop's bound, is SystemConfig's maxOpenFiles
    (sysconf's _SC_OPEN_MAX).
note.subprocess = The fork-exec shim closes what the child shouldn't inherit.
note.swiftpm = The test runner closes every other descriptor before exec (closefrom, or getdtablesize and a loop).

[Windows named pipes]
symbols = CreateNamedPipeW PIPE_ACCESS_INBOUND PIPE_ACCESS_OUTBOUND PIPE_READMODE_BYTE PIPE_REJECT_REMOTE_CLIENTS PIPE_TYPE_BYTE PIPE_WAIT FILE_FLAG_FIRST_PIPE_INSTANCE PeekNamedPipe
category = file I/O
note = Named pipes, the Windows pipes that allow overlapped I/O, and PeekNamedPipe. System's pipe() on Windows is
    ucrt's _pipe.
note.subprocess = The child's standard-I/O pipes on Windows are named pipes, so that the parent's end can use
    overlapped I/O.

# ============================================================== file system

[stat]
symbols = stat lstat
category = file system
note.nio = NIOFS's stat and lstat (lstat is followTargetSymlink: false), NonBlockingFileIO, and
    cleanupUnixDomainSocket's check for a socket before unlinking. `stat` here is also the struct: NIOFS's
    FileInfo reads st_mode, st_size, st_uid, st_gid, st_nlink, st_ino, st_dev and the three timestamps, which Stat
    exposes as mode, size, userID, groupID, linkCount, inode, deviceID and st_atim/st_mtim/st_ctim (the last as the
    C timespec). Not on Windows, where NIOFS keeps its own Stat.
note.subprocess = Checking that a candidate executable is a regular file (executableAccessible) and a pipe's size.

[file type bits]
symbols = S_IFMT S_IFBLK S_IFCHR S_IFDIR S_IFIFO S_IFLNK S_IFREG S_IFSOCK S_IFWHT
category = file system
note.nio = NIOFS's FileType(platformSpecificMode:) and NIOPipeBootstrap's mode switch. NIOFS's public FileType
    collides with System's FileType for clients that import both.
note.subprocess = executableAccessible's regular-file check.

[permission bits]
symbols = S_IRUSR S_IWUSR S_IRGRP S_IROTH mode_t
category = file system
status = covered
system =
    FilePermissions: static var ownerRead: FilePermissions
    FilePermissions: static var ownerWrite: FilePermissions
    FilePermissions: static var groupRead: FilePermissions
    FilePermissions: static var otherRead: FilePermissions
