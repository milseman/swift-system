# =============================================================== C language

[C scalar types]
symbols = size_t ssize_t intptr_t uintptr_t int32_t uint8_t uint16_t uint32_t uint64_t int_least8_t int_least16_t int_least32_t int_least64_t uint_least8_t uint_least16_t uint_least32_t uint_least64_t bool NULL INT_MAX INT_MIN UINT_MAX LONG_MAX LONG_MIN ULONG_MAX SSIZE_MAX TRUE wchar_t u_char u_short u_int u_long suseconds_t
category = C language
swift = Int, UInt, Int64, UInt8 ... and Swift's C type aliases (CInt, CChar, CLong ...), and their min and max
note.nio = Scalar typedefs and limits in Swift signatures and in the C shims and implementations. With System's API
    taking Swift integers (Int64 offsets, Int counts), NIO's Swift code wouldn't need them.
note.subprocess = The shims' C types.
note.swiftpm = wchar_t in the PackagePlugin runtime's error strings.

[off_t]
category = C language
note = C's file offset and size type, whose width is the platform's (Int64 on Darwin, Int on Linux):
    CInterop.Offset, for code whose API names it, such as swift-build's DispatchIO offsets. System's own API takes
    Int64 offsets.

[byte order]
symbols = BYTE_ORDER BIG_ENDIAN LITTLE_ENDIAN
category = C language
swift = Int.bigEndian, Int.littleEndian
note.nio = CNIOSHA1's endianness checks.

[assert]
category = C language
note.nio = The C shims' pointer checks. The index store doesn't record it (assert comes from the textual
    <assert.h>); the extractor adds it from the C scan.

[Win32 scalar types]
symbols = DWORD WORD CHAR UCHAR USHORT ULONG WCHAR LPSTR SSIZE_T UINT8 LONG SIZE_T DWORD_PTR LPWSTR LPWCH WindowsBool LPARAM CALLBACK PWSTR
category = C language
swift = UInt32, UInt16, CChar, UInt8, ...
note.nio = WinSDK's typedefs in NIO's Windows code and CNIOWindows.
note.subprocess = WinSDK's types throughout Subprocess+Windows.swift.
note.swiftpm = WinSDK's types in AsyncProcess, known folders and the password prompt.

[lexical false positives]
symbols = index Float80
category = C language
status = ignore
note = Not OS interfaces: the lexical scan reads Collection's index(after:) and index(_:offsetBy:) as strings.h's
    index, which no package calls, and Float80 is the standard library's type.

[MacTypes]
symbols = OSStatus UniChar DarwinBoolean Boolean
category = C language
swift = Int32 for OSStatus, UInt16 for UniChar, and Bool for DarwinBoolean and Boolean
note = MacTypes.h's scalar typedefs: status codes that Apple's frameworks return, UTF-16 units, and the C Boolean
    that the Darwin overlay's DarwinBoolean wraps; swift-corelibs-foundation's UniChar is CoreFoundation's.

[defaultBuildParameters]
category = C language
status = ignore
note = Not an OS interface: dead code under SwiftPM's opt-in BUILD_MACROS_AS_DYLIBS flag names a property that
    ProductBuildDescription doesn't have, so nothing declares it.

