# ============================================================== file system

[stat]
symbols = stat lstat
category = file system
status = covered
system =
    FilePath: func stat(followTargetSymlink: Bool = true, retryOnInterrupt: Bool = true) throws(Errno) -> Stat
    Stat: init(_ path: UnsafePointer<CChar>, followTargetSymlink: Bool = true, retryOnInterrupt: Bool = true) throws(Errno)
    struct Stat
    CInterop: typealias Stat
note.nio = NIOFS's stat and lstat (lstat is followTargetSymlink: false), NonBlockingFileIO, and
    cleanupUnixDomainSocket's check for a socket before unlinking. `stat` here is also the struct: NIOFS's
    FileInfo reads st_mode, st_size, st_uid, st_gid, st_nlink, st_ino, st_dev and the three timestamps, which Stat
    exposes as mode, size, userID, groupID, linkCount, inode, deviceID and st_atim/st_mtim/st_ctim (the last as the
    C timespec). Not on Windows, where NIOFS keeps its own Stat.
note.subprocess = Checking that a candidate executable is a regular file (executableAccessible) and a pipe's size.

