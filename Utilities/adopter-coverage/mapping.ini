swift = UnsafeMutableRawPointer's copyMemory(from:byteCount:) and initializeMemory(as:repeating:count:)
note = The standard library's, as Prototype/Status/REPORT.md's section 1 decided.
note.nio = NIOCore's ByteBuffer and address comparisons (memcmp), NIOFS's mocking (strlen), and the C
    implementations (llhttp, SHA1).
note.subprocess = Copying arguments and environment strings.

[stdio]
symbols = stderr stdout setvbuf _IONBF stdin _IOLBF fclose fdopen fileno fopen fputs fputc putc FILE _fdopen _fileno tmpfile fmemopen
category = strings/ctype/libm/stdio
note = System's FileStream, provisionally (Prototype/Status/REPORT.md, section 8); print(_:separator:terminator:to:)
    writes only to the standard output without a stream of its own. openTemporaryFile() is tmpfile (not on WASI),
    and open(memory:mode:) and open(memoryCapacity:mode:) are fmemopen (from macOS 10.13; not on Android, below
    API level 23; Prototype/Coverage8/REPORT.md, section 8).
note.nio = llhttp's debug output, and CNIOWindows making stdout unbuffered.
note.subprocess = Formatting error messages.
note.swiftpm = The PackageDescription runtime writes the manifest's JSON with fdopen and fputs; the PackagePlugin runtime sets its streams' buffering; the manifest loader reads output with fopen.

[call stack]
symbols = backtrace backtrace_symbols backtrace_async
category = strings/ctype/libm/stdio
note = System's CallStack, provisionally: returnAddresses(maxCount:) and symbols(for:) are backtrace and
    backtrace_symbols on Darwin and on Linux with glibc (Bionic has them from API level 33, and the BSDs' are in
    libexecinfo, which System doesn't link); asyncReturnAddresses(maxCount:) is Darwin's backtrace_async, from macOS
    12 (Prototype/Coverage8/REPORT.md, section 11).

[formatted output]
symbols = printf fprintf snprintf sprintf vsnprintf vfprintf _shims_snprintf
category = strings/ctype/libm/stdio
swift = string interpolation, written with print(_:) or FileStream's write(_:)
note = C's variadic formatting, which Swift can't call directly: the string that Swift builds, written to a stream,
    or its bytes joined into a buffer, as Subprocess's snprintf of "%s=%s" does.

[strtod]
symbols = strtod strtof strtold
category = strings/ctype/libm/stdio
same.strtod = strtod_l
same.strtof = strtof_l
note = Parsing a floating-point number from C memory: CLocale's parseDouble and parseFloat (strtod_l, strtof_l),
    in the POSIX locale, whose decimal point is always a period, or the global one, which strtod uses; Darwin only.

[perror]
category = strings/ctype/libm/stdio
status = covered
system =
    Errno: var description: String
    FileStream: func write(_ string: String) throws(Errno)
note = perror(s) writes s, a colon, and strerror(errno) to the standard error: FileStream.standardError's
    write("\(s): \(error)\n"), with the Errno that a System call threw and whose description is strerror's.

[log2]
category = strings/ctype/libm/stdio
note.nio = _NIODataStructures' Heap computes its depth with the Darwin/Glibc overlay's log2(Double).

