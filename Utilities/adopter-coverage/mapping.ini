category = file I/O
status = missing
note = Windows' kernel-object handles, its counterpart of file descriptors for files, pipes, processes, threads
    and events: closing, duplicating and waiting on one. System's Windows support is the CRT descriptor layer; it
    has no handle type.
note.nio = ThreadWindows joins and compares threads through real handles, and NIOPosix/Windows.swift's file
    handles are HANDLEs (see [Windows file handles]).
note.subprocess = Every Windows handle Subprocess holds: the child's process and thread, pipes, events.

