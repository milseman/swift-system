# Which System API covers each OS and C-library interface that swift-system's
# adopters use. It's one mapping for every package in packages/, since what
# System covers doesn't depend on who asks.
#
# Utilities/adopter-coverage/check.sh reads this file, checks it against what
# the extractor finds in each package and against System's public API on the
# tip, and writes the reports. README.md explains how to keep it current.
#
# Each section is one entry: an interface, or a group of symbols that make
# up one concept (a function with its flags, constants and types). Keys:
#
#   symbols   the extractor's names for the entry's symbols, separated by
#             whitespace; defaults to the section name. Every symbol a
#             package's extraction finds must be in exactly one entry.
#   category  one of the categories in scripts/check.py (CATEGORIES).
#   status    covered: System has the operation, and any difference is a
#               convention the adopter layers on top, such as NIO turning
#               EAGAIN into IOResult.wouldBlock or Errno into IOError;
#             partial: System has some of it, and the notes say what's
#               missing or different;
#             missing: System has nothing for it;
#             ignore: not an OS interface (an extractor false positive);
#               needs a note.
#   system    for covered and partial, the System declarations, one per
#             line: `Scope: declaration` (or a bare top-level declaration)
#             as the source spells it, without attributes or access
#             modifiers. check.sh fails if one isn't on the tip. Where each
#             one compiles decides the entry's status per platform.
#   status.<Platform>
#             an override for one platform: `missing: reason`.
#   swift     for a missing entry, what the Swift standard library offers
#             instead, if anything.
#   note      what System has and lacks for the entry, whoever asks.
#   note.<package>
#             what that package (the name of its file in packages/: nio,
#             foundation, swiftpm, subprocess) does with the entry, and what
#             it needs that differs. A package's report shows its own note
#             and the shared one.
#
# Conventions that notes don't repeat:
# - System's wrappers retry EINTR when retryOnInterrupt is true (the default)
#   and otherwise throw Errno, with no preconditions. APIs marked System 199
#   are unreleased.
# - NIO's syscall wrappers (Posix.* in NIOPosix/System.swift) retry EINTR,
#   turn EAGAIN into .wouldBlock, trap on EBADF and EFAULT (and EINVAL for
#   reads and writes), and throw IOError.

[config]
# Error-state accessors that every wrapper touches as part of its error
# handling. The gap estimate gives them no wrapper-function lines (they'd
# otherwise own NIO's generic syscall helpers, which go away only when
# NIO's calls move to System), only their own shims.
secondary = errno WSAGetLastError GetLastError SetLastError _get_errno _set_errno CNIOWindows_errno CNIOWindows_set_errno

# ================================================================ file I/O

[read]
symbols = read _read
category = file I/O
status = covered
system =
    FileDescriptor: func read(into buffer: UnsafeMutableRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note.nio = Posix.read, used for sockets, pipes, timerfd and NonBlockingFileIO. On Windows NIO calls ucrt's _read
    directly; System's Windows implementation is the same call.
note.subprocess = The fork-exec shim's child reports exec failures to the parent over a pipe, which the parent reads.

[write]
symbols = write _write
category = file I/O
status = covered
system =
    FileDescriptor: func write(_ buffer: UnsafeRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note.nio = Posix.write, and SelectableEventLoop's printError, which loops over write(2) by hand; writeAll(_:) does
    that loop. On Windows System's implementation is ucrt's _write, which NIO calls directly.
note.subprocess = The fork-exec shim's child writes its errno to the parent's status pipe before _exit.

[pread]
category = file I/O
status = covered
system =
    FileDescriptor: func read(fromAbsoluteOffset offset: Int64, into buffer: UnsafeMutableRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note.nio = NonBlockingFileIO's positional reads.

[pwrite]
category = file I/O
status = covered
system =
    FileDescriptor: func write(toAbsoluteOffset offset: Int64, _ buffer: UnsafeRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note.nio = NonBlockingFileIO's positional writes.

[writev]
symbols = writev
category = file I/O
status = missing
note.nio = Gathering writes for every stream socket and pipe write with more than one buffer (Posix.writev,
    NIOBSDSocket.writev, PipePair): NIO's hottest write path. System has the iovec type (CInterop.IOVec) and an
    io_uring writev opcode, but no writev or readv wrapper. It has to take a caller-owned iovec buffer: NIO reuses
    a pooled array and can't allocate per write.

[UIO_MAXIOV]
category = file I/O
status = partial
system =
    SystemConfig: static func value(_ name: Name) throws(Errno) -> Int?
    SystemConfig.Name: static var maxIOVectors: Self
note.nio = NIO sizes its iovec pool from the compile-time constant; System offers only the runtime
    sysconf(_SC_IOV_MAX) value.

[iovec]
category = file I/O
status = covered
system =
    CInterop: typealias IOVec
note.nio = The C type, through SystemSockets' CInterop alias. It isn't in SystemPackage, where a writev would need it.

[lseek]
symbols = lseek _lseek SEEK_SET SEEK_CUR SEEK_END
category = file I/O
status = covered
system =
    FileDescriptor: func seek(offset: Int64, from whence: FileDescriptor.SeekOrigin) throws -> Int64
    FileDescriptor.SeekOrigin: static var start: SeekOrigin
    FileDescriptor.SeekOrigin: static var current: SeekOrigin
    FileDescriptor.SeekOrigin: static var end: SeekOrigin
note.nio = NIO passes raw SEEK_* values; SeekOrigin(rawValue:) takes them too. On Windows System uses _lseeki64,
    NIO _lseek.

[close]
symbols = close _close
category = file I/O
status = covered
system =
    FileDescriptor: func close() throws
note.nio = Posix.close treats EINTR as success and traps on EBADF on every platform (isUnacceptableErrnoOnClose);
    System doesn't retry close and throws .interrupted, which NIO would catch. Also used by the C shims'
    UDP-offload probes and Android thread-name lookup.
note.subprocess = The fork-exec shim closes descriptors in the child, and Subprocess closes pipe ends in the parent.

[dup]
symbols = dup _dup dup2 _dup2
category = file I/O
status = covered
system =
    FileDescriptor: func duplicate(as target: FileDescriptor? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
note.nio = NIOPipeBootstrap duplicates user descriptors. On Windows System's implementation is _dup.
note.subprocess = The fork-exec shim dup2s the child's standard descriptors.

[ftruncate]
symbols = ftruncate _chsize_s
category = file I/O
status = covered
system =
    FileDescriptor: func resize(to newSize: Int64, retryOnInterrupt: Bool = true) throws
note.nio = NonBlockingFileIO's changeSize. On Windows System's implementation is _chsize_s, as NIO's is.

[fsync]
category = file I/O
status = covered
system =
    FileDescriptor: func synchronize(retryOnInterrupt: Bool = true) throws(Errno)
note.nio = NIOFS's FileHandle.synchronize. Not on Windows, where NIOFS keeps its own stand-in.

[open]
symbols = open O_RDONLY O_WRONLY O_RDWR O_CREAT O_CLOEXEC CNIOWASI_O_CREAT
category = file I/O
status = covered
system =
    FileDescriptor: static func open(_ path: UnsafePointer<CChar>, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
    FileDescriptor: static func open(_ path: FilePath, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
    FileDescriptor.AccessMode: static var readOnly: AccessMode
    FileDescriptor.AccessMode: static var writeOnly: AccessMode
    FileDescriptor.AccessMode: static var readWrite: AccessMode
    FileDescriptor.OpenOptions: static var create: OpenOptions
    FileDescriptor.OpenOptions: static var closeOnExec: OpenOptions
note.nio = Posix.open (vsock's /dev/vsock) and NIOCore's NIOFileHandle(path:). NIO passes a raw oflag; System splits
    it into AccessMode and OpenOptions, both constructible from raw values, and traps on .create without
    permissions. CNIOWASI_O_CREAT exists only because the Clang importer can't see WASILibc's O_CREAT; System reads
    it through its own shim.
note.subprocess = Opening /dev/null for discarded output, and kqueue's close-on-exec open on the BSDs.

[Windows open]
symbols = _sopen_s _O_NOINHERIT _SH_DENYNO _S_IREAD _S_IWRITE _O_BINARY
category = file I/O
status = covered
system =
    FileDescriptor: static func open(_ path: UnsafePointer<CInterop.PlatformChar>, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
note.nio = NIOCore's NIOFileHandle on Windows opens with ucrt's _sopen_s. System's Windows open is the wide-character
    _wsopen_s with the same share mode; closeOnExec maps to _O_NOINHERIT.
note.subprocess = _open_osfhandle's _O_BINARY for pipes.

[openat]
category = file I/O
status = covered
system =
    FileDescriptor: static func open(_ path: UnsafePointer<CChar>, relativeTo fd: FileDescriptor, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws(Errno) -> FileDescriptor
    FileDescriptor: static func open(_ path: FilePath, relativeTo fd: FileDescriptor, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws(Errno) -> FileDescriptor
note.nio = NIOFS opens everything relative to a directory descriptor. Adopted already on NIO's adopt-nio branch.

[AT_FDCWD]
category = file system
status = missing
note.nio = NIOFS on Linux resolves paths relative to the current directory with AT_FDCWD; System's *at APIs take a
    FileDescriptor, and there's no FileDescriptor constant for the current directory.

[O_TMPFILE]
symbols = O_TMPFILE CNIOLinux_O_TMPFILE
category = file I/O
status = missing
note.nio = NIOFS on Linux creates unnamed temporary files with O_TMPFILE, then links them into place with linkat and
    AT_EMPTY_PATH. OpenOptions has no .temporaryFile.

[fcntl status flags]
symbols = fcntl F_GETFL F_SETFL O_NONBLOCK
category = file I/O
status = covered
system =
    FileDescriptor: func statusFlags() throws(Errno) -> StatusFlags
    FileDescriptor: func setStatusFlags(_ flags: StatusFlags) throws(Errno)
    FileDescriptor.StatusFlags: static var nonBlocking: StatusFlags
    FileDescriptor: func control(_ command: Command, _ value: CInt, retryOnInterrupt: Bool = true) throws(Errno) -> CInt
note.nio = NIO's only fcntl use is setting O_NONBLOCK, in two identical copies (Posix.setNonBlocking, and
    setNonBlocking(fileDescriptor:) in NIOPosix/FileDescriptor.swift), which also map Darwin's EINVAL on a closed
    socket to NIOFcntlFailedError. statusFlags() and setStatusFlags(_:) do the same get-and-set. On Windows NIO
    uses ioctlsocket(FIONBIO) instead.
note.subprocess = Setting pipes non-blocking for the asynchronous I/O (AsyncIO+Unix.swift), and the shims' flag checks.

[F_SETNOSIGPIPE]
category = sockets
status = covered
system =
    FileDescriptor: func setNoSigPipe(_ noSigPipe: Bool) throws(Errno)
    FileDescriptor.Command: static var setNoSigPipe: Self
note.nio = Darwin's per-descriptor SIGPIPE suppression, which NIO applies to sockets and pipes alike
    (BaseSocketProtocol.ignoreSIGPIPE). Darwin only, as the call is; other platforms ignore SIGPIPE process-wide
    (see [SIGPIPE]).

