# Which System API covers each OS and C-library interface swift-nio uses.
#
# Utilities/adopter-coverage/check.sh reads this file, checks it against what
# the extractor finds in NIO and against System's public API on the tip,
# and writes the report. README.md explains how to keep it current.
#
# Each section is one entry: an interface, or a group of symbols that make
# up one concept (a function with its flags, constants and types). Keys:
#
#   symbols   the extractor's names for the entry's symbols, separated by
#             whitespace; defaults to the section name. Every symbol the
#             extractor finds must be in exactly one entry.
#   category  one of the categories in scripts/check.py (CATEGORIES).
#   status    covered: System has the operation, and any difference is a
#               convention NIO layers on top, such as turning EAGAIN into
#               IOResult.wouldBlock or Errno into IOError;
#             partial: System has some of it, and the note says what's
#               missing or different;
#             missing: System has nothing for it;
#             ignore: not an OS interface (an extractor false positive);
#               needs a note.
#   system    for covered and partial, the System declarations, one per
#             line: `Scope: declaration` (or a bare top-level declaration)
#             as the source spells it, without attributes or access
#             modifiers. check.sh fails if one isn't on the tip. Where each
#             one compiles decides the entry's status per platform.
#   status.<Platform>
#             an override for one platform: `missing: reason`.
#   swift     for a missing entry, what the Swift standard library offers
#             instead, if anything.
#   note      what NIO does with it, and what differs.
#
# Conventions that notes don't repeat: NIO's syscall wrappers
# (Posix.* in NIOPosix/System.swift) retry EINTR, turn EAGAIN into
# .wouldBlock, trap on EBADF and EFAULT (and EINVAL for reads and writes),
# and throw IOError. System's retry EINTR when retryOnInterrupt is true (the
# default) and otherwise throw Errno, with no preconditions. APIs marked
# System 199 are unreleased.

[config]
# NIO's syscall layer: files whose functions exist only to reach the OS. The
# gap ranking counts the code lines of the thin wrapper functions (at most
# 40 lines) in these files that reference a gap, plus the C shims; see
# scripts/method.md.
wrapper-files =
    Sources/NIOPosix/System.swift
    Sources/NIOPosix/Linux.swift
    Sources/NIOPosix/LinuxUring.swift
    Sources/NIOPosix/LinuxCPUSet.swift
    Sources/NIOPosix/ThreadPosix.swift
    Sources/NIOPosix/ThreadWindows.swift
    Sources/NIOPosix/BSDSocketAPIPosix.swift
    Sources/NIOPosix/BSDSocketAPIWindows.swift
    Sources/NIOPosix/BSDSocketAPICommon.swift
    Sources/NIOPosix/Windows.swift
    Sources/NIOPosix/FileDescriptor.swift
    Sources/NIOCore/BSDSocketAPI.swift
    Sources/NIOCore/SystemCallHelpers.swift
    Sources/NIOConcurrencyHelpers/lock.swift
    Sources/NIOConcurrencyHelpers/NIOLock.swift
    Sources/NIOConcurrencyHelpers/NIOThreadPoolWorkAvailable.swift
    Sources/NIOFS/Internal/System Calls/*
    Sources/_NIOFileSystem/Internal/System Calls/*
# Error-state accessors that every wrapper touches as part of its error
# handling. The gap estimate gives them no wrapper-function lines (they'd
# otherwise own NIO's generic syscall helpers, which go away only when
# NIO's calls move to System), only their own shims.
secondary = errno WSAGetLastError GetLastError SetLastError _get_errno _set_errno CNIOWindows_errno CNIOWindows_set_errno

# ================================================================ file I/O

[read]
symbols = read _read
category = file I/O
status = covered
system =
    FileDescriptor: func read(into buffer: UnsafeMutableRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note = Posix.read, used for sockets, pipes, timerfd and NonBlockingFileIO. On Windows NIO calls ucrt's _read
    directly; System's Windows implementation is the same call.

[write]
symbols = write _write
category = file I/O
status = covered
system =
    FileDescriptor: func write(_ buffer: UnsafeRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note = Posix.write, and SelectableEventLoop's printError, which loops over write(2) by hand; writeAll(_:) does
    that loop. On Windows System's implementation is ucrt's _write, which NIO calls directly.

[pread]
category = file I/O
status = covered
system =
    FileDescriptor: func read(fromAbsoluteOffset offset: Int64, into buffer: UnsafeMutableRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note = NonBlockingFileIO's positional reads.

[pwrite]
category = file I/O
status = covered
system =
    FileDescriptor: func write(toAbsoluteOffset offset: Int64, _ buffer: UnsafeRawBufferPointer, retryOnInterrupt: Bool = true) throws -> Int
note = NonBlockingFileIO's positional writes.

[writev]
symbols = writev
category = file I/O
status = missing
note = Gathering writes for every stream socket and pipe write with more than one buffer (Posix.writev,
    NIOBSDSocket.writev, PipePair): NIO's hottest write path. System has the iovec type (CInterop.IOVec) and an
    io_uring writev opcode, but no writev or readv wrapper. It has to take a caller-owned iovec buffer: NIO reuses
    a pooled array and can't allocate per write.

[UIO_MAXIOV]
category = file I/O
status = partial
system =
    SystemConfig: static func value(_ name: Name) throws(Errno) -> Int?
    SystemConfig.Name: static var maxIOVectors: Self
note = NIO sizes its iovec pool from the compile-time constant; System offers only the runtime
    sysconf(_SC_IOV_MAX) value.

[iovec]
category = file I/O
status = covered
system =
    CInterop: typealias IOVec
note = The C type, through SystemSockets' CInterop alias. It isn't in SystemPackage, where a writev would need it.

[lseek]
symbols = lseek _lseek SEEK_SET SEEK_CUR SEEK_END
category = file I/O
status = covered
system =
    FileDescriptor: func seek(offset: Int64, from whence: FileDescriptor.SeekOrigin) throws -> Int64
    FileDescriptor.SeekOrigin: static var start: SeekOrigin
    FileDescriptor.SeekOrigin: static var current: SeekOrigin
    FileDescriptor.SeekOrigin: static var end: SeekOrigin
note = NIO passes raw SEEK_* values; SeekOrigin(rawValue:) takes them too. On Windows System uses _lseeki64,
    NIO _lseek.

[close]
symbols = close _close
category = file I/O
status = covered
system =
    FileDescriptor: func close() throws
note = Posix.close treats EINTR as success and traps on EBADF on every platform (isUnacceptableErrnoOnClose);
    System doesn't retry close and throws .interrupted, which NIO would catch. Also used by the C shims'
    UDP-offload probes and Android thread-name lookup.

[dup]
symbols = dup _dup
category = file I/O
status = covered
system =
    FileDescriptor: func duplicate(as target: FileDescriptor? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
note = NIOPipeBootstrap duplicates user descriptors. On Windows System's implementation is _dup.

[ftruncate]
symbols = ftruncate _chsize_s
category = file I/O
status = covered
system =
    FileDescriptor: func resize(to newSize: Int64, retryOnInterrupt: Bool = true) throws
note = NonBlockingFileIO's changeSize. On Windows System's implementation is _chsize_s, as NIO's is.

[fsync]
category = file I/O
status = covered
system =
    FileDescriptor: func synchronize(retryOnInterrupt: Bool = true) throws(Errno)
note = NIOFS's FileHandle.synchronize. Not on Windows, where NIOFS keeps its own stand-in.

[open]
symbols = open O_RDONLY O_WRONLY O_RDWR O_CREAT O_CLOEXEC CNIOWASI_O_CREAT
category = file I/O
status = covered
system =
    FileDescriptor: static func open(_ path: UnsafePointer<CChar>, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
    FileDescriptor: static func open(_ path: FilePath, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
    FileDescriptor.AccessMode: static var readOnly: AccessMode
    FileDescriptor.AccessMode: static var writeOnly: AccessMode
    FileDescriptor.AccessMode: static var readWrite: AccessMode
    FileDescriptor.OpenOptions: static var create: OpenOptions
    FileDescriptor.OpenOptions: static var closeOnExec: OpenOptions
note = Posix.open (vsock's /dev/vsock) and NIOCore's NIOFileHandle(path:). NIO passes a raw oflag; System splits
    it into AccessMode and OpenOptions, both constructible from raw values, and traps on .create without
    permissions. CNIOWASI_O_CREAT exists only because the Clang importer can't see WASILibc's O_CREAT; System reads
    it through its own shim.

[Windows open]
symbols = _sopen_s _O_NOINHERIT _SH_DENYNO _S_IREAD _S_IWRITE
category = file I/O
status = covered
system =
    FileDescriptor: static func open(_ path: UnsafePointer<CInterop.PlatformChar>, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws -> FileDescriptor
note = NIOCore's NIOFileHandle on Windows opens with ucrt's _sopen_s. System's Windows open is the wide-character
    _wsopen_s with the same share mode; closeOnExec maps to _O_NOINHERIT.

[openat]
category = file I/O
status = covered
system =
    FileDescriptor: static func open(_ path: UnsafePointer<CChar>, relativeTo fd: FileDescriptor, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws(Errno) -> FileDescriptor
    FileDescriptor: static func open(_ path: FilePath, relativeTo fd: FileDescriptor, _ mode: FileDescriptor.AccessMode, options: FileDescriptor.OpenOptions = FileDescriptor.OpenOptions(), permissions: FilePermissions? = nil, retryOnInterrupt: Bool = true) throws(Errno) -> FileDescriptor
note = NIOFS opens everything relative to a directory descriptor. Adopted already on NIO's adopt-nio branch.

[AT_FDCWD]
category = file system
status = missing
note = NIOFS on Linux resolves paths relative to the current directory with AT_FDCWD; System's *at APIs take a
    FileDescriptor, and there's no FileDescriptor constant for the current directory.

[O_TMPFILE]
symbols = O_TMPFILE CNIOLinux_O_TMPFILE
category = file I/O
status = missing
note = NIOFS on Linux creates unnamed temporary files with O_TMPFILE, then links them into place with linkat and
    AT_EMPTY_PATH. OpenOptions has no .temporaryFile.

[fcntl status flags]
symbols = fcntl F_GETFL F_SETFL O_NONBLOCK
category = file I/O
status = covered
system =
    FileDescriptor: func statusFlags() throws(Errno) -> StatusFlags
    FileDescriptor: func setStatusFlags(_ flags: StatusFlags) throws(Errno)
    FileDescriptor.StatusFlags: static var nonBlocking: StatusFlags
    FileDescriptor: func control(_ command: Command, _ value: CInt, retryOnInterrupt: Bool = true) throws(Errno) -> CInt
note = NIO's only fcntl use is setting O_NONBLOCK, in two identical copies (Posix.setNonBlocking, and
    setNonBlocking(fileDescriptor:) in NIOPosix/FileDescriptor.swift), which also map Darwin's EINVAL on a closed
    socket to NIOFcntlFailedError. statusFlags() and setStatusFlags(_:) do the same get-and-set. On Windows NIO
    uses ioctlsocket(FIONBIO) instead.

[F_SETNOSIGPIPE]
category = sockets
status = covered
system =
    FileDescriptor: func setNoSigPipe(_ noSigPipe: Bool) throws(Errno)
    FileDescriptor.Command: static var setNoSigPipe: Self
note = Darwin's per-descriptor SIGPIPE suppression, which NIO applies to sockets and pipes alike
    (BaseSocketProtocol.ignoreSIGPIPE). Darwin only, as the call is; other platforms ignore SIGPIPE process-wide
    (see [SIGPIPE]).

[fchmod]
category = file system
status = covered
system =
    FileDescriptor: func setPermissions(_ permissions: FilePermissions, retryOnInterrupt: Bool = true) throws(Errno)
note = NIOFS's FileHandle.replacePermissions.

[futimens]
symbols = futimens UTIME_NOW UTIME_OMIT CNIOLinux_UTIME_NOW CNIOLinux_UTIME_OMIT
category = file system
status = covered
system =
    FileDescriptor: func setTimes(access: timespec?, modification: timespec?, retryOnInterrupt: Bool = true) throws(Errno)
    FileDescriptor: func setTimesToNow(access: Bool = true, modification: Bool = true, retryOnInterrupt: Bool = true) throws(Errno)
note = NIOFS's FileHandle.setTimes. UTIME_OMIT is a nil argument and UTIME_NOW is setTimesToNow; the CNIOLinux
    constants exist because Glibc's UTIME_* macros don't import.

[fstat]
category = file system
status = covered
system =
    FileDescriptor: func stat(retryOnInterrupt: Bool = true) throws(Errno) -> Stat
note = NIOFS's FileHandle.info, and NIOPipeBootstrap's check that a descriptor is a pipe, socket or character
    device. Stat.type replaces NIO's S_IFMT switch.

[ioctl]
category = file I/O
status = missing
note = Posix.ioctl has one caller: reading the local vsock context ID (IOCTL_VM_SOCKETS_GET_LOCAL_CID on
    /dev/vsock). System's only ioctls are the terminal ones behind TerminalDescriptor. A generic ioctl isn't a
    good System API; a vsock one might be (see [vsock]).

# ============================================================== file system

[stat]
symbols = stat lstat
category = file system
status = covered
system =
    FilePath: func stat(followTargetSymlink: Bool = true, retryOnInterrupt: Bool = true) throws(Errno) -> Stat
    Stat: init(_ path: UnsafePointer<CChar>, followTargetSymlink: Bool = true, retryOnInterrupt: Bool = true) throws(Errno)
    struct Stat
    CInterop: typealias Stat
note = NIOFS's stat and lstat (lstat is followTargetSymlink: false), NonBlockingFileIO, and
    cleanupUnixDomainSocket's check for a socket before unlinking. `stat` here is also the struct: NIOFS's
    FileInfo reads st_mode, st_size, st_uid, st_gid, st_nlink, st_ino, st_dev and the three timestamps, which Stat
    exposes as mode, size, userID, groupID, linkCount, inode, deviceID and st_atim/st_mtim/st_ctim (the last as the
    C timespec). Not on Windows, where NIOFS keeps its own Stat.

[file type bits]
symbols = S_IFMT S_IFBLK S_IFCHR S_IFDIR S_IFIFO S_IFLNK S_IFREG S_IFSOCK S_IFWHT
category = file system
status = covered
system =
    Stat: var type: FileType
    FileType: static var directory: FileType
    FileType: static var characterSpecial: FileType
    FileType: static var blockSpecial: FileType
    FileType: static var regular: FileType
    FileType: static var fifo: FileType
    FileType: static var symbolicLink: FileType
    FileType: static var socket: FileType
    FileType: static var whiteout: FileType
note = NIOFS's FileType(platformSpecificMode:) and NIOPipeBootstrap's mode switch. NIOFS's public FileType
    collides with System's FileType for clients that import both.

[permission bits]
symbols = S_IRUSR S_IWUSR S_IRGRP S_IROTH mode_t
category = file system
status = covered
system =
    FilePermissions: static var ownerRead: FilePermissions
    FilePermissions: static var ownerWrite: FilePermissions
    FilePermissions: static var groupRead: FilePermissions
    FilePermissions: static var otherRead: FilePermissions
    CInterop: typealias Mode
note = Default modes for new files (NonBlockingFileIO, NIOFileHandle).

[mkdir]
category = file system
status = covered
system =
    FilePath: func makeDirectory(permissions: FilePermissions, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: static func makeDirectory(_ path: UnsafePointer<CChar>, permissions: FilePermissions, retryOnInterrupt: Bool = true) throws(Errno)
note = NIOFS and NonBlockingFileIO.createDirectory, which on non-Darwin walks the path making each directory.

[mkpath_np]
category = file system
status = missing
note = Darwin's recursive mkdir, used by NonBlockingFileIO.createDirectory(withIntermediateDirectories:) on Darwin
    only; NIO's recursive mkdir loop serves the other platforms and could serve Darwin too.

[rename]
category = file system
status = covered
system =
    FilePath: func rename(to newPath: FilePath, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: static func rename(_ oldPath: UnsafePointer<CChar>, to newPath: UnsafePointer<CChar>, retryOnInterrupt: Bool = true) throws(Errno)
note = NIOFS and NonBlockingFileIO.

[rename with options]
symbols = renamex_np renameatx_np RENAME_EXCL RENAME_SWAP CNIOLinux_renameat2 CNIOLinux_RENAME_NOREPLACE CNIOLinux_RENAME_EXCHANGE syscall SYS_renameat2
category = file system
status = covered
system =
    FilePath: func rename(to newPath: FilePath, options: RenameOptions, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: func rename(relativeTo fd: FileDescriptor, to newPath: FilePath, relativeTo newFD: FileDescriptor, options: RenameOptions, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath.RenameOptions: static var exclusive: RenameOptions
    FilePath.RenameOptions: static var swap: RenameOptions
note = NIOFS's exclusive and swapping renames: renamex_np/renameatx_np on Darwin, and on Linux renameat2 through
    CNIOLinux_renameat2, which makes the raw syscall because Musl lacks the wrapper. System's shim does the same,
    including ENOSYS. Not on FreeBSD or OpenBSD, where NIOFS has no equivalent either.

[remove]
category = file system
status = missing
note = remove(3), unlink-or-rmdir, in NIOFS and NonBlockingFileIO. unlink and removeDirectory compose into it,
    but the errno differs: Darwin's libc lstats first, glibc tries rmdir first.

[unlink]
symbols = unlink unlinkat
category = file system
status = covered
system =
    FilePath: func unlink(retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: static func unlink(_ path: UnsafePointer<CChar>, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: func unlink(relativeTo fd: FileDescriptor, flags: FilePath.ResolutionFlags = [], retryOnInterrupt: Bool = true) throws(Errno)
note = NIOFS, NonBlockingFileIO, and cleanupUnixDomainSocket.

[symlink]
symbols = symlink symlinkat
category = file system
status = covered
system =
    FilePath: func makeSymbolicLink(to target: FilePath, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: static func makeSymbolicLink(_ path: UnsafePointer<CChar>, to target: UnsafePointer<CChar>, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: func makeSymbolicLink(relativeTo fd: FileDescriptor, to target: FilePath, retryOnInterrupt: Bool = true) throws(Errno)
note = NIOFS and NonBlockingFileIO.

[readlink]
category = file system
status = covered
system =
    FilePath: func readSymbolicLink(retryOnInterrupt: Bool = true) throws(Errno) -> FilePath
    FilePath: static func readSymbolicLink(_ path: UnsafePointer<CChar>, retryOnInterrupt: Bool = true) throws(Errno) -> FilePath
note = NIO reads into a PATH_MAX buffer, which silently truncates longer targets; System's grows its buffer and
    keeps non-UTF-8 bytes.

[link]
symbols = link linkat AT_SYMLINK_FOLLOW
category = file system
status = covered
system =
    FilePath: func makeHardLink(to existingPath: FilePath, retryOnInterrupt: Bool = true) throws(Errno)
    FilePath: func makeHardLink(relativeTo fd: FileDescriptor, to existingPath: FilePath, relativeTo existingFD: FileDescriptor, flags: FilePath.ResolutionFlags = [], retryOnInterrupt: Bool = true) throws(Errno)
    FilePath.ResolutionFlags: static var symlinkFollow: ResolutionFlags
note = NIOFS. System's `to:` is the existing file, the reverse of NIO's link(from:to:) labels.

[AT_EMPTY_PATH]
symbols = AT_EMPTY_PATH CNIOLinux_AT_EMPTY_PATH
category = file system
status = missing
note = NIOFS on Linux links an O_TMPFILE file into place with linkat(fd, "", ..., AT_EMPTY_PATH).
    FilePath.ResolutionFlags has no .emptyPath.

[getcwd]
category = file system
status = covered
system =
    FilePath: static func currentWorkingDirectory() throws(Errno) -> FilePath
note = NIOFS's FileSystem.currentWorkingDirectory. System's grows its buffer instead of stopping at PATH_MAX.

[temporary directory]
symbols = confstr _CS_DARWIN_USER_TEMP_DIR GetTempPath2W
category = file system
status = missing
note = NIOFS's temporaryDirectory on Darwin asks confstr(_CS_DARWIN_USER_TEMP_DIR); System's Darwin wrapper for
    it is internal (FilePathTemp). GetTempPath2W is the Windows selector's socket-pair path.

[extended attributes]
symbols = flistxattr fgetxattr fsetxattr fremovexattr XATTR_MAXNAMELEN
category = file system
status = missing
note = NIOFS's FileHandle.attributeNames/valueForAttribute/updateValueForAttribute/removeValueForAttribute. The
    Darwin calls take extra position and options arguments, which a System API would hide.

[copyfile]
symbols = copyfile fcopyfile COPYFILE_ALL COPYFILE_CLONE COPYFILE_UNLINK copyfile_flags_t copyfile_state_t
category = file system
status = missing
note = NIOFS's copyItem on Darwin, cloning where the file system can.

[getuid]
symbols = getuid uid_t
category = file system
status = covered
system =
    UserID: static var real: UserID
    CInterop: typealias UserID
note = NIOFS's home-directory lookup.

[getpwuid_r]
symbols = getpwuid_r passwd
category = file system
status = covered
system =
    UserEntry: init?(userID: UserID, retryOnInterrupt: Bool = true) throws(Errno)
    UserEntry: var homeDirectory: FilePath
note = NIOFS's homeDirectory. NIO checks for -1 and errno, but getpwuid_r returns its error, and its 1024-byte
    buffer never grows; System gets both right.

[PATH_MAX]
symbols = PATH_MAX MAX_PATH
category = file system
status = partial
system =
    SystemConfig: static func value(_ name: PathName, for path: FilePath) throws(Errno) -> Int?
    SystemConfig.PathName: static var maxPathBytes: Self
note = NIO sizes path buffers with the compile-time constant (readlink, getcwd, the Windows selector's socket
    path); System has only the runtime pathconf value, and its own path APIs no longer need a limit.

[Windows file information]
symbols = GetFileInformationByHandle BY_HANDLE_FILE_INFORMATION FILE_ATTRIBUTE_DIRECTORY FILE_ATTRIBUTE_READONLY FILE_ATTRIBUTE_REPARSE_POINT FILETIME
category = file system
status = missing
note = NIOFS's Windows stand-in for stat, and the Windows socket code's check for a Unix-domain socket file.

[Windows reparse points]
symbols = DeviceIoControl FSCTL_GET_REPARSE_POINT IO_REPARSE_TAG_AF_UNIX CNIOWindows_REPARSE_DATA_BUFFER CreateFileW GENERIC_READ OPEN_EXISTING FILE_SHARE_READ FILE_SHARE_WRITE FILE_SHARE_DELETE FILE_FLAG_BACKUP_SEMANTICS FILE_FLAG_OPEN_REPARSE_POINT
category = file system
status = missing
note = NIOBSDSocket.cleanupUnixDomainSocket on Windows opens the path and reads its reparse tag to tell a
    Unix-domain socket from an ordinary file. CNIOWindows declares REPARSE_DATA_BUFFER itself because WinSDK
    doesn't expose it.

[Windows delete]
symbols = SetFileInformationByHandle FileDispositionInfoEx FILE_DISPOSITION_INFO_EX FILE_DISPOSITION_FLAG_DELETE FILE_DISPOSITION_FLAG_POSIX_SEMANTICS DeleteFileW
category = file system
status = missing
note = Deleting a Unix-domain socket's file on Windows (cleanupUnixDomainSocket, and the WSAPoll selector's
    wake-up socket).

# ============================================================== directories

[directory streams]
symbols = opendir fdopendir readdir closedir DIR dirent DT_BLK DT_CHR DT_DIR DT_FIFO DT_LNK DT_REG DT_SOCK DT_UNKNOWN DT_WHT CNIODarwin_dirent_dname CNIOLinux_dirent_dname
category = directories
status = missing
note = NIOFS's DirectoryEntries (fdopendir), and NonBlockingFileIO.listDirectory (opendir), with the errno = 0
    sentinel to tell the end from an error. The dirent_dname shims exist to read d_name. System has internal
    fdopendir, readdir and closedir wrappers for its own temporary-directory cleanup. A public directory stream
    should nest its entry type (NIOFS has a public DirectoryEntry).

[fts]
symbols = fts_open fts_read fts_close FTS FTSENT _ftsent FTS_D FTS_DC FTS_DEFAULT FTS_DNR FTS_DOT FTS_DP FTS_ERR FTS_F FTS_NS FTS_NSOK FTS_SL FTS_SLNONE FTS_LOGICAL FTS_NOCHDIR FTS_PHYSICAL CNIOLinux_fts_open
category = directories
status = missing
note = NIOFS's recursive directory listing (DirectoryEntries with recursive: true). CNIOLinux_fts_open works
    around Android's nullability annotations.

# ================================================================== sockets

[socket]
category = sockets
status = covered
system =
    SocketDescriptor: static func open(_ domain: Domain, _ type: ConnectionType, protocol: ProtocolID = .default, retryOnInterrupt: Bool = true) throws -> SocketDescriptor
note = BaseSocket.makeSocket. NIO ORs SOCK_NONBLOCK and SOCK_CLOEXEC into the type on Linux, which
    ConnectionType(rawValue:) allows, but System names neither (see [socket creation flags]). Not on Windows.

[socket creation flags]
symbols = SOCK_NONBLOCK SOCK_CLOEXEC
category = sockets
status = missing
note = NIO's Linux socket() and accept4() pass these to skip an fcntl per socket. System has no creation
    options for sockets (FileDescriptor has PipeOptions and DuplicateOptions as a precedent).

[socket types]
symbols = SOCK_STREAM SOCK_DGRAM SOCK_RAW
category = sockets
status = covered
system =
    SocketDescriptor.ConnectionType: static var stream: ConnectionType
    SocketDescriptor.ConnectionType: static var datagram: ConnectionType
    SocketDescriptor.ConnectionType: static var raw: ConnectionType
note = NIOBSDSocket.SocketType.

[address families]
symbols = AF_INET AF_INET6 AF_UNIX AF_UNSPEC PF_INET PF_INET6 PF_UNIX PF_LOCAL
category = sockets
status = covered
system =
    SocketDescriptor.Domain: static var ipv4: Domain
    SocketDescriptor.Domain: static var ipv6: Domain
    SocketDescriptor.Domain: static var local: Domain
    SocketDescriptor.Domain: static var unspecified: Domain
    SocketAddress.Family: static var ipv4: Family
    SocketAddress.Family: static var ipv6: Family
    SocketAddress.Family: static var local: Family
note = NIOBSDSocket.AddressFamily and ProtocolFamily. Not on Windows, where NIO imports them from WinSDK.

[socketpair]
category = sockets
status = covered
system =
    SocketDescriptor: static func pair(_ domain: Domain, _ type: ConnectionType, protocol: ProtocolID = .default, retryOnInterrupt: Bool = true) throws -> (SocketDescriptor, SocketDescriptor)
note = Posix.socketpair.

[bind]
category = sockets
status = covered
system =
    SocketDescriptor: func bind(to address: SocketAddress) throws
note = NIO binds from a raw sockaddr pointer; System takes its own SocketAddress, a copy of up to 128 bytes.
    System's SocketAddress collides by name with NIOCore's public SocketAddress in any file that imports both.

[listen]
category = sockets
status = covered
system =
    SocketDescriptor: func listen(backlog: Int) throws

[accept]
category = sockets
status = covered
