# import-probe's settings for packages whose own modules re-export the C library.
#
# Each section is a package, named as its clone's directory:
#
#   shims  modules of the package that exist to re-export platform C modules: their imports are
#          removed from the probed target like a C module's, so the target loses what it took
#          through them. A name the shim declares itself is classed "shim's own".
#   note   copied into the summary.
#
# A re-export that isn't a shim (a library that also re-exports C, as NIOPosix does) is left in
# place: the probe finds it (an `@_exported` import it removes from that target), and lists the
# targets that still reach C through it, whose names through it it can't see. The alternative,
# demoting it to a plain import for the whole build, would fail every dependent target that relies
# on it, and SwiftPM builds no target whose dependency failed.

[swift-tools-support-core]
shims = TSCLibc
note = TSCLibc exists to re-export the C library; off Windows it re-exports nothing on migrate-unix.

[swift-build]
shims = SWBLibc
note = SWBLibc re-exports SWBCLibc and, on Windows, ucrt, CRT and WinSDK.

[swift-testing]
shims = _TestingInternals
note = _TestingInternals is a C target that includes the C library's headers; its module re-exports them.

[swift-nio]
note = NIOPosix re-exports Glibc, Musl and Android with `@_exported` (System.swift), for its clients' source
    compatibility; the targets that depend on NIOPosix reach C through it.
