# The api check's allowed exceptions: declarations a rule mustn't report, each with its reason.
#
# A section is a rule. A key is a declaration's path as api-delta prints it (a shell glob, so
# `*.encode(to:)` covers every type's), or for api/typed-throws `throws:<error type>`. The value
# is the reason, which must say what makes the declaration an exception and where that's decided.
#
# Seeded by the tooling-1 lane on 2026-10-06 with the exceptions CLAUDE.md records and with facts
# about each declaration; the entries marked "proposed" are for Michael to confirm. Everything
# else the check reports stays a finding until someone decides it here.

[api/availability]
FileDescriptor.read(into:retryOnInterrupt:) = Span-based I/O: explicit OS availability (macOS 15, iOS 18, ...) in an extension with an older System version, as CLAUDE.md's Availability section records.
FileDescriptor.read(fromAbsoluteOffset:into:retryOnInterrupt:) = Span-based I/O, as above.
FileDescriptor.write(_:retryOnInterrupt:) = Span-based I/O, as above.
FileDescriptor.write(toAbsoluteOffset:_:retryOnInterrupt:) = Span-based I/O, as above.
FileDescriptor.read(filling:retryOnInterrupt:) = Span-based I/O, as above.
FileDescriptor.read(fromAbsoluteOffset:filling:retryOnInterrupt:) = Span-based I/O, as above.
FileDescriptor.writeAll(_:retryOnInterrupt:) = Span-based I/O, as above.
FileDescriptor.writeAll(toAbsoluteOffset:_:retryOnInterrupt:) = Span-based I/O, as above.
IORing.Request.PollEvents* = Upstream: on origin/main since b62bce1 (#273). Local main is 27 commits behind origin/main, so api-delta counts it as added; api-burndown flags these `upstream`.

[api/typed-throws]
throws:Win32.Error = Proposed. Win32 API throws Win32.Error, GetLastError's code, the Windows counterpart of Errno (the Win32 drafts, SYS-0010 to SYS-0016).
throws:DynamicLibrary.LoaderError = Proposed. The loader reports failures through dlerror's message, not errno, so its errors are a type of their own.
throws:Mach.KernelError = Proposed. Mach calls return a kern_return_t, not an errno.
*.encode(to:) = Codable's requirement, which throws untyped.
*.init(from:) = Codable's requirement, which throws untyped.
PThread.Mutex.withLock(_:) = Proposed. Throws both its own Errno and whatever its closure throws, so no one error type fits.
PThread.ReadWriteLock.withLockForReading(_:) = Proposed. Throws its own Errno and its closure's errors, as withLock.
PThread.ReadWriteLock.withLockForWriting(_:) = Proposed. Throws its own Errno and its closure's errors, as withLock.
TerminalDescriptor.withAttributes(when:retryOnInterrupt:_:do:) = Proposed. Throws its own Errno and its closure's errors.
TerminalDescriptor.withRawMode(retryOnInterrupt:do:) = Proposed. Throws its own Errno and its closure's errors.
SpawnAttributes.withCAttributes(_:) = Proposed. Throws its own Errno and its closure's errors.
SpawnFileAction.withCFileActions(_:_:) = Proposed. Throws its own Errno and its closure's errors.
SocketDescriptor.closeAfter(_:) = Proposed. Throws its closure's errors and close's Errno.
Win32.FileHandle.withConsoleMode(_:_:) = Proposed. Throws its own Win32.Error and its closure's errors.
Win32.FileHandle.withLock(byteRange:mode:_:) = Proposed. Throws its own Win32.Error and its closure's errors.
Win32.FileHandle.withLockIfAvailable(byteRange:mode:_:) = Proposed. Throws its own Win32.Error and its closure's errors.
